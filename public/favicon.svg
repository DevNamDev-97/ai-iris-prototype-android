<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </radialGradient>
  </defs>

  <!-- Squircle Rounded Card Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#inner-glow)" stroke="#e5e7eb" stroke-width="3" filter="url(#card-shadow)" />

  <!-- Iris Concentric Acoustic Wave Aperture Rings -->
  <g fill="none" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arcs (Crescent Soundwave Eyebrow Array) -->
    <!-- Arc 1 (Innermost) -->
    <path d="M 180 200 A 86 86 0 0 1 332 200" stroke-width="4.5" />
    <!-- Arc 2 -->
    <path d="M 166 190 A 104 104 0 0 1 346 190" stroke-width="5.5" />
    <!-- Arc 3 -->
    <path d="M 152 180 A 122 122 0 0 1 360 180" stroke-width="6.5" />
    <!-- Arc 4 -->
    <path d="M 140 170 A 140 140 0 0 1 372 170" stroke-width="7.5" />
    <!-- Arc 5 -->
    <path d="M 130 160 A 158 158 0 0 1 382 160" stroke-width="8.5" />
    <!-- Arc 6 -->
    <path d="M 122 150 A 176 176 0 0 1 390 150" stroke-width="9.5" />
    <!-- Arc 7 (Outer) -->
    <path d="M 116 140 A 194 194 0 0 1 396 140" stroke-width="9.0" />
    <!-- Arc 8 (Outermost) -->
    <path d="M 112 130 A 212 212 0 0 1 400 130" stroke-width="6.5" />

    <!-- Bottom Arcs (Crescent Soundwave Lower Array) -->
    <!-- Arc 1 (Innermost) -->
    <path d="M 180 312 A 86 86 0 0 0 332 312" stroke-width="4.5" />
    <!-- Arc 2 -->
    <path d="M 166 322 A 104 104 0 0 0 346 322" stroke-width="5.5" />
    <!-- Arc 3 -->
    <path d="M 152 332 A 122 122 0 0 0 360 332" stroke-width="6.5" />
    <!-- Arc 4 -->
    <path d="M 140 342 A 140 140 0 0 0 372 342" stroke-width="7.5" />
    <!-- Arc 5 -->
    <path d="M 130 352 A 158 158 0 0 0 382 352" stroke-width="8.5" />
    <!-- Arc 6 -->
    <path d="M 122 362 A 176 176 0 0 0 390 362" stroke-width="9.5" />
    <!-- Arc 7 (Outer) -->
    <path d="M 116 372 A 194 194 0 0 0 396 372" stroke-width="9.0" />
    <!-- Arc 8 (Outermost) -->
    <path d="M 112 382 A 212 212 0 0 0 400 382" stroke-width="6.5" />
  </g>

  <!-- Center Typography: I.R.I.S. -->
  <g fill="#111827">
    <!-- Letter I -->
    <path d="M 98 226 L 114 226 L 114 286 L 98 286 Z" />
    <!-- Dot 1 -->
    <circle cx="127" cy="281" r="5" />

    <!-- Letter R -->
    <path d="M 144 226 L 178 226 C 194 226 204 235 204 248 C 204 257 197 265 186 268 L 206 286 L 187 286 L 170 270 L 160 270 L 160 286 L 144 286 Z M 160 240 L 160 256 L 176 256 C 183 256 188 253 188 248 C 188 243 183 240 176 240 Z" />
    <!-- Dot 2 -->
    <circle cx="221" cy="281" r="5" />

    <!-- Letter I -->
    <path d="M 238 226 L 254 226 L 254 286 L 238 286 Z" />
    <!-- Dot 3 -->
    <circle cx="267" cy="281" r="5" />

    <!-- Letter S -->
    <path d="M 334 237 C 327 230 316 226 302 226 C 286 226 274 234 274 246 C 274 258 284 263 298 266 L 308 268 C 319 270 324 274 324 279 C 324 285 316 289 304 289 C 291 289 280 284 274 275 L 262 284 C 271 296 286 303 304 303 C 324 303 340 293 340 278 C 340 264 329 258 314 255 L 304 253 C 294 251 290 247 290 242 C 290 237 296 233 304 233 C 313 233 322 236 326 242 Z" />
  </g>
</svg>
